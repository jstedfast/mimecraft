[package]
name = "mimecraft"
version = "0.1.0"
edition = "2024"
description = "An idiomatic Rust port of MimeKit's core MIME library"
license = "MIT AND Unicode-3.0"
publish = false

[dependencies]
criterion = { version = "0.8.2", default-features = false, optional = true }
encoding_rs = "0.8"
fluent-uri = "0.4"
getrandom = "0.4"
idna = "1.1"
memchr = "2"
metabench = { version = "0.2.1", optional = true }
unicode-general-category = "1.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["simd"]
simd = []
bench-metabench = ["dep:criterion", "dep:metabench"]

[profile.release]
lto = "fat"
codegen-units = 1

[[bench]]
name = "base64"
harness = false

[[bench]]
name = "mime_reader"
harness = false

[[bench]]
name = "base64_metabench"
harness = false
required-features = ["bench-metabench"]

[[bench]]
name = "mime_reader_metabench"
harness = false
required-features = ["bench-metabench"]
