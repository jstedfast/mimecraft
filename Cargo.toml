[package]
name = "mimecraft"
version = "0.1.0"
edition = "2024"
description = "An idiomatic Rust port of MimeKit's core MIME library"
license = "MIT"
publish = false

[dependencies]
encoding_rs = "0.8"
fluent-uri = "0.4"
getrandom = "0.4"
hostname = "0.4"
idna = "1.1"
memchr = "2"
unicode-general-category = "1.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["simd"]
simd = []

[profile.release]
lto = "fat"
codegen-units = 1

[[bench]]
name = "base64"
harness = false

[[bench]]
name = "mime_reader"
harness = false
